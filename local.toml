# Builds a plugin against this checkout instead of the pinned rev, for changing family and a plugin
# together. From the plugin's repo, with family checked out beside it:
#
#     cargo build --config ../family/local.toml
#
# The paths are relative to this file's folder's parent? No: Cargo resolves them against the
# working directory, so run from the plugin's root.
[patch."https://github.com/Iurig/family"]
family-dsp   = { path = "../family/crates/dsp" }
family-wav   = { path = "../family/crates/wav" }
family-xtask = { path = "../family/crates/xtask" }
